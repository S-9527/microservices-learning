name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Compile
        run: mvn -B -q -DskipTests compile

      - name: Test
        run: mvn -B clean test

      - name: Package
        run: mvn -B -q -DskipTests package
