server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        # 不配 ip：Nacos Client 会自动探测容器 IP，无需环境变量
      config:
        server-addr: ${NACOS_SERVER:localhost:8848}
  # 本地只放「必须本地确定」的配置；业务与数据源配置从 Nacos 拉取
  config:
    import:
      - nacos:shared-config.yml
      - nacos:user-service.yml?refreshEnabled=true
